<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 100" width="500" height="100">
  <defs>
    <!-- Gradient mới: Xanh dương công nghệ (Blue to Cyan) -->
    <linearGradient id="subtitleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6" /> <!-- Blue-500 -->
      <stop offset="50%" style="stop-color:#06b6d4" /> <!-- Cyan-500 -->
      <stop offset="100%" style="stop-color:#0ea5e9" /> <!-- Sky-500 -->
    </linearGradient>

    <!-- Hiệu ứng phát sáng nhẹ -->
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Glow mạnh hơn cho icon -->
    <filter id="iconGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- CHỮ VIỀN (Border/Stroke) -->
  <text x="250" y="60" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
        font-weight="600" 
        font-size="32" 
        fill="none"
        stroke="#1d4ed8"
        stroke-width="1.5"
        text-anchor="middle"
        letter-spacing="5"
        opacity="0.5">
    TECH SOLUTIONS
  </text>

  <!-- CHỮ CHÍNH: TECH SOLUTIONS -->
  <text x="250" y="60" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
        font-weight="600" 
        font-size="32" 
        fill="url(#subtitleGrad)" 
        text-anchor="middle"
        letter-spacing="5"
        filter="url(#subtleGlow)">
    TECH SOLUTIONS
  </text>

  <!-- SAO NHẤP NHÁY 1 (Xanh dương) -->
  <g transform="translate(55, 20)" filter="url(#subtleGlow)">
    <path d="M 4 0 L 5 3 L 8 3.5 L 6 5.5 L 6.5 8 L 4 6.5 L 1.5 8 L 2 5.5 L 0 3.5 L 3 3 Z" 
          fill="#60a5fa">
      <animate attributeName="opacity" 
               values="1;0.2;1" 
               dur="1.8s" 
               repeatCount="indefinite" />
      <animateTransform attributeName="transform"
                        type="rotate"
                        values="0 4 4; 20 4 4; 0 4 4"
                        dur="2.5s"
                        repeatCount="indefinite" />
    </path>
  </g>

  <!-- SAO NHẤP NHÁY 2 (Xanh ngọc) -->
  <g transform="translate(428, 15)" filter="url(#subtleGlow)">
    <path d="M 5 0 L 6 4 L 10 4.5 L 7 7 L 7.5 11 L 5 9 L 2.5 11 L 3 7 L 0 4.5 L 4 4 Z" 
          fill="#22d3ee">
      <animate attributeName="opacity" 
               values="1;0.3;1" 
               dur="2.2s" 
               begin="0.5s"
               repeatCount="indefinite" />
      <animateTransform attributeName="transform"
                        type="rotate"
                        values="0 5 5; -15 5 5; 0 5 5"
                        dur="3s"
                        repeatCount="indefinite" />
    </path>
  </g>

  <!-- SAO NHẤP NHÁY 3 (Xanh sky) -->
  <g transform="translate(95, 78)" filter="url(#subtleGlow)">
    <path d="M 3 0 L 3.5 2 L 6 2.5 L 4 4 L 4.5 6 L 3 5 L 1.5 6 L 2 4 L 0 2.5 L 2.5 2 Z" 
          fill="#0ea5e9">
      <animate attributeName="opacity" 
               values="1;0.15;1" 
               dur="2.5s" 
               begin="1s"
               repeatCount="indefinite" />
      <animateTransform attributeName="transform"
                        type="scale"
                        values="1;1.3;1"
                        dur="2s"
                        additive="sum"
                        repeatCount="indefinite" />
    </path>
  </g>

  <!-- SAO NHẤP NHÁY 4 (Xanh sáng) -->
  <g transform="translate(388, 82)" filter="url(#subtleGlow)">
    <circle cx="3" cy="3" r="2" fill="#7dd3fc">
      <animate attributeName="opacity" 
               values="1;0.2;1" 
               dur="1.5s" 
               begin="0.7s"
               repeatCount="indefinite" />
      <animate attributeName="r" 
               values="2;3;2" 
               dur="1.5s" 
               repeatCount="indefinite" />
    </circle>
  </g>

  <!-- ICON: ROCKET 🚀 (màu xanh) -->
  <g transform="translate(455, 28)" filter="url(#iconGlow)">
    <!-- Thân tên lửa -->
    <path d="M 12 0 L 18 15 L 18 30 L 12 35 L 6 30 L 6 15 Z" 
          fill="url(#subtitleGrad)" 
          stroke="#3b82f6" 
          stroke-width="1.5">
      <animateTransform attributeName="transform"
                        type="translate"
                        values="0,0; 0,-5; 0,0"
                        dur="1.5s"
                        repeatCount="indefinite" />
    </path>
    
    <!-- Cánh trái -->
    <path d="M 6 20 L 0 30 L 6 28 Z" 
          fill="#1d4ed8" 
          opacity="0.9"/>
    
    <!-- Cánh phải -->
    <path d="M 18 20 L 24 30 L 18 28 Z" 
          fill="#1d4ed8" 
          opacity="0.9"/>
    
    <!-- Cửa sổ -->
    <circle cx="12" cy="12" r="3.5" fill="#ffffff" opacity="0.8">
      <animate attributeName="opacity" 
               values="0.8;0.4;0.8" 
               dur="2s" 
               repeatCount="indefinite" />
    </circle>
    
    <!-- Ngọn lửa (màu xanh-cam) -->
    <path d="M 12 35 L 9 44 L 12 41 L 15 44 Z" 
          fill="#06b6d4">
      <animate attributeName="opacity" 
               values="1;0.3;1" 
               dur="0.4s" 
               repeatCount="indefinite" />
      <animateTransform attributeName="transform"
                        type="scale"
                        values="1;1.3;1"
                        dur="0.4s"
                        additive="sum"
                        repeatCount="indefinite" />
    </path>
    
    <!-- Tia lửa nhỏ bên trái -->
    <circle cx="9" cy="40" r="1.5" fill="#7dd3fc">
      <animate attributeName="opacity" 
               values="1;0;1" 
               dur="0.6s" 
               repeatCount="indefinite" />
      <animate attributeName="cy" 
               values="40;45;40" 
               dur="0.6s" 
               repeatCount="indefinite" />
    </circle>
    
    <!-- Tia lửa nhỏ bên phải -->
    <circle cx="15" cy="40" r="1.5" fill="#22d3ee">
      <animate attributeName="opacity" 
               values="1;0;1" 
               dur="0.5s" 
               begin="0.2s"
               repeatCount="indefinite" />
      <animate attributeName="cy" 
               values="40;46;40" 
               dur="0.5s" 
               begin="0.2s"
               repeatCount="indefinite" />
    </circle>
  </g>
</svg>
